<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>致张力 · 生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#414659;--mu:rgba(65,70,89,.55);--gold:#b98f4a;--pink:#cf8ba6;--blue:#5f8cc4;
--serif:"Songti SC","Noto Serif SC",serif;--hand:"Kaiti SC","STKaiti",KaiTi,serif;--e:cubic-bezier(.19,1,.22,1)}
html,body{height:100%}
body{color:var(--ink);font:14px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;
background:radial-gradient(120% 80% at 12% 6%,#fdf4e5,transparent 56%),radial-gradient(100% 70% at 88% 10%,#e9f1fb,transparent 56%),radial-gradient(120% 90% at 50% 102%,#f8ecf2,transparent 60%),linear-gradient(170deg,#fcfaf6,#f1f6fa 52%,#f9f2f6)}
button{font:inherit;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}
/* 背景 */
.aur{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(46px) hue-rotate(calc(var(--h,0)*1deg));transition:filter 2.6s var(--e);animation:mv 30s ease-in-out infinite alternate;
background:radial-gradient(closest-side at 26% 24%,rgba(255,214,160,.55),transparent 70%),radial-gradient(closest-side at 76% 32%,rgba(186,214,247,.55),transparent 70%),radial-gradient(closest-side at 48% 84%,rgba(246,196,216,.42),transparent 70%)}
@keyframes mv{to{transform:translate3d(3%,3%,0) scale(1.07)}}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none}
/* 书页金边 */
.frame{position:fixed;inset:12px;z-index:4;pointer-events:none;border:1px solid rgba(185,143,74,.38);border-radius:4px}
.frame::before,.frame::after{content:"✦";position:absolute;font-size:13px;color:var(--gold);background:#fbf8f2;padding:0 6px;left:50%;transform:translateX(-50%)}
.frame::before{top:-10px}.frame::after{bottom:-10px}
/* 加载 */
#ld{position:fixed;inset:0;z-index:100;background:#fbf8f2;display:grid;place-items:center;text-align:center;transition:opacity 1.1s var(--e),visibility 1.1s;font-size:12px;letter-spacing:.45em;color:var(--mu)}
#ld.done{opacity:0;visibility:hidden}
#ld i{display:block;width:56px;height:56px;margin:0 auto 22px;border-radius:50%;border:1px solid rgba(185,143,74,.2);border-top-color:var(--gold);animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 场景 */
.sc{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:60px 44px 120px;opacity:0;pointer-events:none;transform:translateY(16px);filter:blur(10px);transition:opacity .9s var(--e),transform 1.2s var(--e),filter .9s var(--e)}
.sc.on{opacity:1;pointer-events:auto;transform:none;filter:none;transition-delay:.26s}
.in{width:100%;max-width:1060px;max-height:100%;overflow-y:auto;scrollbar-width:none}
.in::-webkit-scrollbar{display:none}
.stag{opacity:0;transition:opacity .95s var(--e),transform .95s var(--e)}
.stag.u{transform:translateY(24px)}.stag.l{transform:translateX(-52px)}.stag.r{transform:translateX(52px)}
.sc.on .stag{opacity:1;transform:none;transition-delay:calc(.32s + var(--d,0s))}
.deco{position:absolute;color:rgba(185,143,74,.5);font-size:19px;opacity:0;transition:opacity 1.4s .9s}
.deco.s2{font-size:13px;color:rgba(207,139,166,.55)}.deco.s3{font-size:24px;color:rgba(95,140,196,.4)}
.sc.on .deco{opacity:1}
.chap{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.chap span{font:11.5px var(--serif);letter-spacing:.4em;color:var(--gold)}
.chap i{width:60px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.chap h2{font:400 clamp(21px,2.9vw,29px) var(--serif);letter-spacing:.14em}
/* 金角饰框 */
.orn{position:relative}
.orn::before,.orn::after{content:"";position:absolute;width:16px;height:16px;border:1.5px solid var(--gold);opacity:.75;pointer-events:none}
.orn::before{left:-7px;top:-7px;border-right:0;border-bottom:0}
.orn::after{right:-7px;bottom:-7px;border-left:0;border-top:0}
/* 拍立得与比例控制 */
.pol{background:#fff;padding:12px 12px 44px;border-radius:3px;box-shadow:0 22px 44px -20px rgba(120,130,160,.55),0 2px 6px rgba(120,130,160,.14);transform:rotate(-3deg);transition:transform 1s var(--e);position:relative}
.pol:hover{transform:rotate(-1deg) translateY(-4px)}
.pol .ph-wrap{border-radius:2px;overflow:hidden;position:relative;background:#f0f0f0}
.pol .ph-wrap.landscape{aspect-ratio:4/3}
.pol .ph-wrap.portrait{aspect-ratio:3/4}
.pol .ph-wrap.screenshot{aspect-ratio:4/5;background:#fff;display:flex;justify-content:center}
.pol .ph-wrap.screenshot img{object-fit:contain;object-position:top}
.ph{display:grid;place-items:center;font:13px var(--hand);letter-spacing:.24em;color:rgba(65,70,89,.5);width:100%;height:100%;padding:20px;text-align:center}
.cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:14px var(--hand);color:rgba(65,70,89,.62)}
.tape{position:absolute;z-index:3;width:90px;height:26px;top:-12px;left:50%;margin-left:-45px;transform:rotate(-4deg);background:rgba(226,208,166,.6);border:1px dashed rgba(255,255,255,.6);pointer-events:none}
/* 封面 */
.cover{flex-direction:column}
.cc{position:relative;z-index:3;text-align:center}
.eb{font-size:11.5px;letter-spacing:.5em;color:var(--gold);margin-bottom:30px}
.ht{font:400 clamp(44px,9vw,108px)/1.14 var(--serif);letter-spacing:.05em}
.ht span{display:block}.ht span+span{margin-left:9%}.ht span:first-child{margin-left:-5%}
.ht .g{background:linear-gradient(100deg,#414659,#b98f4a 34%,#cf8ba6 66%,#5f8cc4);background-size:220%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 11s linear infinite}
@keyframes sh{to{background-position:220%}}
.sub{margin-top:28px;font-size:clamp(13px,1.5vw,15px);letter-spacing:.26em;color:var(--mu)}
.cps{position:absolute;inset:0;pointer-events:none}
.cp{position:absolute;top:0;bottom:0;display:flex;align-items:center;width:clamp(120px,15vw,190px)}
.cp0{left:clamp(16px,7vw,110px)}.cp1{right:clamp(16px,7vw,110px)}.cp1 .pol{transform:rotate(6deg)}
.cp .pol{width:100%;padding:9px 9px 34px}.cp .cap{bottom:8px;font-size:12px}
/* 双栏 */
.spread{display:grid;grid-template-columns:1.15fr .85fr;gap:54px;align-items:center}
.pro p{font-size:clamp(14.5px,1.7vw,16.5px);color:rgba(65,70,89,.78);line-height:2.15;letter-spacing:.05em;margin-bottom:20px}
.pro b{font-weight:400;color:var(--gold)}
.qm{font:72px/1 var(--serif);color:rgba(185,143,74,.25);display:block;margin-bottom:-14px}
/* ===== 拾光（故事便签） ===== */
.sc.jrn{padding:0;overflow:hidden}
.cpill{position:absolute;left:36px;top:32px;z-index:5;padding:6px 18px;background:rgba(251,248,242,.74);border-radius:999px;backdrop-filter:blur(6px)}
.cpill .chap{margin:0}
.hud{position:absolute;right:38px;top:42px;z-index:5;font-size:11px;letter-spacing:.24em;color:var(--mu)}
.hud b{font-weight:400;color:var(--gold);margin-right:12px}
.wd{position:absolute;left:0;top:0;width:100%;z-index:2;transition:transform 1.8s cubic-bezier(.45,.05,.2,1)}
.ln{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.seg{fill:none;stroke:rgba(185,143,74,.6);stroke-width:1.6;stroke-dasharray:3 9;stroke-linecap:round;opacity:0;transition:opacity 1.4s}
.seg.on{opacity:1}
.it{position:absolute;width:clamp(180px,22vw,300px);transform:translate(-50%,-50%) scale(.85);opacity:0;transition:opacity 1.2s var(--e),transform 1.4s var(--e)}
.it.show{opacity:1;transform:translate(-50%,-50%)}
.it.past{opacity:.9}

/* 故事卡片（取代空白照片） */
.story-card{background:#fffdf9;padding:28px 20px 24px;border-radius:4px;box-shadow:0 20px 40px -15px rgba(120,130,160,.4);transform:rotate(var(--rt,-2deg));position:relative;border:1px solid rgba(185,143,74,.2);text-align:center}
.story-card .icon{font-size:36px;margin-bottom:16px;display:inline-block;animation:fl 3s infinite ease-in-out}
.story-card .cap{position:static;margin-top:16px;font-family:var(--hand);font-size:16px;color:var(--gold);font-weight:bold}
.story-card .short-text{font-size:14px;line-height:1.8;color:rgba(65,70,89,.7);font-family:var(--hand);letter-spacing:.05em}

.spark{position:absolute;left:50%;top:42%;width:86px;height:86px;margin:-43px 0 0 -43px;border:0;background:none;display:grid;place-items:center;z-index:4;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .8s var(--e),transform .8s var(--e)}
.spark.show{opacity:1;transform:none;pointer-events:auto}
.spark b{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff,#f0b45e 46%,rgba(240,180,94,.25) 80%);box-shadow:0 0 0 5px rgba(255,255,255,.55),0 0 22px 5px rgba(240,170,80,.6);transition:.6s var(--e)}
.spark em{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(240,175,90,.55);animation:rp 3.4s ease-out infinite}
.spark em+em{animation-delay:1.7s}
@keyframes rp{0%{transform:scale(.26);opacity:.9}100%{transform:scale(1);opacity:0}}
.spark.bst b{transform:scale(3.4);opacity:0}
.jc{position:absolute;z-index:6;width:min(360px,40vw);opacity:0;pointer-events:none;transform:translateY(14px) rotate(var(--nr,-1.5deg));transition:opacity .8s var(--e),transform .9s var(--e)}
.jc.show{opacity:1;pointer-events:auto;transform:rotate(var(--nr,-1.5deg))}
.jc.R{right:7%;--nr:1.8deg}.jc.L{left:7%;--nr:-1.8deg}
.jc>div{padding:24px 26px 18px;background:#fffdf7;border-radius:4px;box-shadow:0 26px 48px -20px rgba(110,120,150,.55);border-top:3px solid rgba(185,143,74,.45)}
.jc small{display:block;font:13px var(--hand);letter-spacing:.26em;color:var(--gold);margin-bottom:8px}
.jc h3{font:400 19px var(--serif);letter-spacing:.07em;margin-bottom:8px}
.jc p{font-size:13.5px;color:rgba(65,70,89,.75);line-height:1.95}
.btn{margin-top:14px;padding:8px 20px;font-size:12px;letter-spacing:.24em;color:var(--gold);background:rgba(185,143,74,.08);border:1px solid rgba(185,143,74,.38);border-radius:999px;transition:.5s var(--e)}
.btn:hover{background:rgba(185,143,74,.16)}
/* 影像 */
.pf{position:relative;background:#fff;padding:12px;border-radius:3px;transform:rotate(-2deg);box-shadow:0 26px 52px -22px rgba(120,130,160,.5);max-width:400px;margin:0 auto}
.pb{overflow:hidden;transition:opacity .6s var(--e),filter .6s var(--e);position:relative}
.pb.out{opacity:0;filter:blur(7px)}
.pb.landscape{aspect-ratio:4/3}
.pb.portrait{aspect-ratio:3/4}
.pb.screenshot{aspect-ratio:4/5;background:#fbfbfb}
.pb.screenshot img{object-fit:contain;object-position:top}
.note{position:relative;padding:28px 24px 24px;background:#fffdf5;border-radius:3px;transform:rotate(2.2deg);box-shadow:0 20px 40px -20px rgba(120,130,160,.45);background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(95,140,196,.12) 31px 32px)}
.pc{font:16px/2 var(--hand);color:rgba(65,70,89,.8);letter-spacing:.06em;min-height:68px;margin-bottom:18px}
.sw{display:flex;align-items:center;gap:14px;font-size:11.5px;letter-spacing:.28em;color:var(--mu)}
.sw button{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid rgba(65,70,89,.14);color:var(--ink);font-size:16px;transition:.5s var(--e)}
.sw button:hover{color:var(--gold);border-color:rgba(185,143,74,.6)}
/* 鉴语 */
.qc{position:relative;max-width:620px;padding:34px 30px;background:rgba(255,255,255,.74);border:1px solid rgba(185,143,74,.35);border-radius:6px;box-shadow:0 26px 54px -26px rgba(120,130,160,.45);margin:0 auto}
.qq{font:clamp(17px,2.3vw,22px)/1.7 var(--serif);letter-spacing:.06em;margin-bottom:22px}
.qo{display:block;width:100%;margin-bottom:10px;padding:13px 18px;text-align:left;font-size:14px;color:rgba(65,70,89,.82);background:rgba(255,255,255,.7);border:1px solid rgba(65,70,89,.1);border-radius:10px;transition:.5s var(--e)}
.qo:hover{color:var(--gold);border-color:rgba(185,143,74,.55);transform:translateX(5px)}
.qp{margin-top:18px;text-align:center;font-size:11px;letter-spacing:.3em;color:rgba(65,70,89,.38)}
.fx{animation:fx .7s var(--e) both}
@keyframes fx{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
.rs{text-align:center;display:none}
.rs h4{font:400 clamp(32px,6.5vw,54px) var(--serif);letter-spacing:.1em;margin:6px 0 14px;background:linear-gradient(100deg,#414659,#b98f4a 52%,#cf8ba6);-webkit-background-clip:text;background-clip:text;color:transparent}
.rs p{max-width:460px;margin:0 auto 22px;color:rgba(65,70,89,.74);line-height:2}
.tg span{display:inline-block;margin:0 4px 8px;padding:6px 16px;font-size:12px;letter-spacing:.14em;border:1px solid rgba(65,70,89,.12);border-radius:999px;background:#fff}
.btn.fill{color:#fff;background:linear-gradient(100deg,#c9a05c,#b98f4a);border-color:transparent}
/* 致张力（信件） */
.letter-wrap{position:relative;max-width:640px;margin:0 auto;background:#fffdf9;padding:40px 36px;border-radius:4px;box-shadow:0 20px 50px -20px rgba(120,130,160,.4);border:1px solid rgba(185,143,74,.2)}
.letter-page{display:none;opacity:0;transition:opacity .6s var(--e)}
.letter-page.on{display:block;opacity:1;animation:fx .8s var(--e)}
.letter-page p{font-size:clamp(14.5px,1.7vw,16px);line-height:2.2;color:rgba(65,70,89,.85);margin-bottom:16px;text-indent:2em}
.letter-page p.no-indent{text-indent:0}
.letter-page .sign{text-align:right;margin-top:30px;font-family:var(--hand);font-size:18px;color:rgba(65,70,89,.7)}
.letter-nav{margin-top:30px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--mu)}
.hoshino-sticker{position:absolute;width:100px;height:100px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 20px rgba(0,0,0,.15);transform:rotate(10deg);z-index:5;right:-20px;top:-20px;pointer-events:none}
.hoshino-sticker img{object-fit:cover}
/* 结尾 */
.out{text-align:center;position:relative}
.out h2{font:400 clamp(38px,7.5vw,84px) var(--serif);letter-spacing:.12em;background:linear-gradient(100deg,#414659,#b98f4a 48%,#cf8ba6);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 9s linear infinite}
.out p{margin-top:20px;font-size:13px;letter-spacing:.26em;color:var(--mu)}
.out small{display:block;margin-top:50px;font-size:11px;letter-spacing:.3em;color:rgba(65,70,89,.32)}
/* 小光灵 */
#gd{position:fixed;left:26px;bottom:26px;z-index:50;display:flex;align-items:center;gap:12px;pointer-events:none;opacity:0;transition:opacity 1s .6s}
body.ready #gd{opacity:1}
.orb{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe3a6 45%,#f0b45e);box-shadow:0 0 0 6px rgba(255,226,170,.35),0 0 26px 6px rgba(240,180,94,.55);animation:fl 3.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.bub{max-width:min(300px,64vw);padding:9px 16px;background:rgba(255,255,255,.88);border:1px solid rgba(185,143,74,.35);border-radius:14px 14px 14px 3px;transition:opacity .4s}
.bub b{display:block;font:400 13.5px var(--hand);color:var(--ink);letter-spacing:.05em}
.bub small{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--mu)}
.bub.sw0{opacity:0}
#au{position:fixed;right:26px;bottom:26px;z-index:50;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid rgba(185,143,74,.4);color:var(--ink);opacity:0;transition:.5s}
body.ready #au{opacity:1}#au.pl{color:var(--gold)}
.rip{position:fixed;z-index:45;pointer-events:none;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:1px solid rgba(185,143,74,.55);background:radial-gradient(circle,rgba(255,220,170,.4),transparent 70%);animation:ro .85s var(--e) forwards}
@keyframes ro{from{transform:scale(.18)}to{transform:scale(2.6);opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;z-index:60;transform:translateX(-50%);padding:9px 18px;font-size:12.5px;background:#fff;border:1px solid rgba(185,143,74,.3);border-radius:999px}
/* 手机端适配 */
@media(max-width:900px){.spread{grid-template-columns:1fr;gap:30px}.pol,.pf,.note{max-width:340px;margin:0 auto}.deco,.dk{display:none}}
@media(max-width:640px){
.frame{inset:7px}.sc{padding:44px 20px 112px;filter:none}
.cps{position:static;display:flex;justify-content:center;gap:20px;margin-top:38px;order:2}
.cp{position:static;width:112px}.cp .pol{padding:7px 7px 28px}
.cc{order:1}.ht{font-size:clamp(38px,12vw,54px)}.sub{margin-top:20px;font-size:12.5px;letter-spacing:.2em}
.chap{gap:10px;margin-bottom:20px}.chap i{width:30px}
.pol,.pf,.note{max-width:230px}.note{max-width:none}
.pro p{font-size:14px;line-height:2;margin-bottom:14px}.qm{font-size:54px}
.cpill{left:20px;top:24px}.hud{right:22px;top:76px;font-size:10px}.it{width:160px}.jc{left:5%!important;right:auto!important;top:auto!important;bottom:84px;width:90%}.jc>div{padding:18px 18px 14px}
.qc{padding:26px 20px}#gd{left:14px;bottom:16px}#au{right:14px;bottom:16px;width:36px;height:36px}
.orb{width:28px;height:28px}.bub{padding:7px 12px}
.letter-wrap{padding:24px 20px}.letter-page p{font-size:14px;line-height:2.1}
.hoshino-sticker{width:70px;height:70px;right:-10px;top:-10px}
}
/* ===== 移动端加固（v2） ===== */
@supports(height:100dvh){html,body{height:100dvh}}
body{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media(max-width:640px){
  .sc{padding:52px 18px calc(128px + env(safe-area-inset-bottom,0px))}
  .in{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #gd{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #au{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .bub{max-width:min(250px,58vw)}
  .cps{gap:14px}.cp{width:104px}
  .pol,.pf{max-width:min(300px,76vw)}
  .ht{font-size:clamp(34px,11.5vw,52px)}
  .letter-nav{padding-bottom:8px}
  .letter-wrap{padding:18px 16px}
  .letter-page p{font-size:13px;line-height:1.9;margin-bottom:12px}
  .letter-page .sign{margin-top:20px;font-size:16px}
  /* 压缩纵向尺寸，尽量一屏读完 */
  .chap{margin-bottom:14px}
  .qm{display:none}
  .pf{max-width:min(272px,74vw);padding:9px}
  .note{padding:20px 16px 16px}
  .pc{font-size:15px;line-height:1.85;min-height:auto;margin-bottom:12px}
  .pro p{font-size:13.5px;line-height:1.95;margin-bottom:12px}
  .rs h4{font-size:clamp(28px,9vw,40px)}
  .qc{padding:22px 16px}
  .qq{font-size:16px}
  .qo{padding:12px 14px;font-size:13.5px}
  .sc.jrn .spark{display:none}
  /* 拾光：改成纵向卡片流，去掉固定坐标与光点 */
  .sc.jrn{padding:0}
  .sc.jrn .wd{position:relative;height:auto!important;transform:none!important;display:flex;flex-direction:column;gap:16px;
    padding:96px 18px calc(140px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:100dvh}
  .sc.jrn .it{position:static!important;left:auto!important;top:auto!important;width:100%;max-width:320px;margin:0 auto;
    transform:none!important;opacity:1!important;pointer-events:auto}
  .sc.jrn .story-card{transform:rotate(0deg)!important}
  .sc.jrn .ln{display:none}

function layout(){const W=innerWidth,H=innerHeight,w=its[0].offsetWidth||180,k=W<640?1.05:1;
 pos=J.map((j,i)=>{let x=(j.x!=null?parseFloat(j.x):zx[i%zx.length])/100*W;x=Math.min(Math.max(x,w/2+16),W-w/2-16);return{x,y:H*(.3+.36*i)*k}});
 its.forEach((d,i)=>{d.style.left=pos[i].x+'px';d.style.top=pos[i].y+'px'});
 const h=pos[pos.length-1].y+H*.5;wd.style.height=h+'px';ln.setAttribute('width',W);ln.setAttribute('height',h);
 ln.innerHTML=pos.slice(1).map((p,i)=>{const a=pos[i];return`<path class="seg${i<ji?' on':''}" d="M${a.x} ${a.y}Q${(a.x+p.x)/2+(i%2?-60:60)} ${(a.y+p.y)/2} ${p.x} ${p.y}"/>`}).join('');
 wd.style.transform=`translateY(${-camY()}px)`}
function setSt(){$('#jp').textContent=J[ji].place;$('#jn').textContent=(ji+1)+' / '+J.length}
function showSp(i){const s=its[i].querySelector('.spark');s.classList.remove('bst');s.classList.add('show')}
function startJ(){if(jOn)return;jOn=true;setSt();setTimeout(()=>its[0].classList.add('show'),800);setTimeout(()=>showSp(0),1600)}
function openJ(i){if(jReading||jDone||i!==ji)return;jReading=true;const s=its[i].querySelector('.spark');s.classList.add('bst');s.classList.remove('show');
 const j=J[i],W=innerWidth,H=innerHeight,sy=pos[i].y-camY();
 $('#jd').textContent=j.date;$('#jt').textContent=j.title;$('#jx').textContent=j.text;
 jc.className='jc '+(pos[i].x<W/2?'R':'L');jc.style.top=Math.min(Math.max(sy-110,90),H-320)+'px';
 setTimeout(()=>{jc.classList.add('show');say()},420)}
function jNext(){if(jBusy||!jc.classList.contains('show'))return;jBusy=true;jc.classList.remove('show');
 setTimeout(()=>{its[ji].classList.add('past');
  if(ji<J.length-1){ji++;jReading=false;setSt();wd.style.transform=`translateY(${-camY()}px)`;if(ln.children[ji-1])ln.children[ji-1].classList.add('on');
   setTimeout(()=>its[ji].classList.add('show'),800);setTimeout(()=>{showSp(ji);say()},1700)}
  else{jDone=true;$('#jp').textContent='拾光完成';say()}
  jBusy=false},520)}
$('#jb').onclick=jNext;addEventListener('resize',layout);layout();

/* 影像 */
const P=C.photos;let pi=0,pbz=false;
function rp(){
  const p=P[pi];
  $('#pb').className = 'pb ' + (p.type||'landscape');
  $('#pb').innerHTML = p.img ? `<img src="${p.img}" alt="" onerror="this.outerHTML='<div class=\\'ph\\' style=\\'background:linear-gradient(160deg,${p.c[0]},${p.c[1]})\\'>${p.label||''}</div>'">` : `<div class="ph" style="background:linear-gradient(160deg,${p.c[0]},${p.c[1]})">${p.label||''}</div>`;
  $('#pc').innerHTML=br(p.cap);
  $('#pi').textContent=String(pi+1).padStart(2,'0')+' / '+String(P.length).padStart(2,'0');
}
function sw(d){if(pbz||P.length<=1)return;pbz=true;$('#pb').classList.add('out');setTimeout(()=>{pi=(pi+d+P.length)%P.length;rp();$('#pb').classList.remove('out');pbz=false},460)}
$('#pv').onclick=()=>sw(-1);$('#pn').onclick=()=>sw(1);rp();

/* 鉴语 */
const Q=C.quiz;let qi=0,sc2={};
const qb=$('#qb'),rs=$('#rs');
function rq(){const q=Q.qs[qi];$('#qq').textContent=q.q;$('#qo').innerHTML='';q.o.forEach(([t,d])=>{const b=document.createElement('button');b.className='qo';b.textContent=t;b.onclick=()=>pick(d);$('#qo').appendChild(b)});$('#qp').textContent=`第 ${qi+1} / ${Q.qs.length} 题`}
function pick(d){sc2[d]=(sc2[d]||0)+1;qi++;qb.style.opacity=0;qb.style.transition='opacity .35s';setTimeout(()=>{qb.style.opacity=1;if(qi<Q.qs.length){rq();qb.classList.remove('fx');void qb.offsetWidth;qb.classList.add('fx')}else res()},380)}
function res(){const o=Object.entries(sc2).sort((a,b)=>b[1]-a[1]).map(e=>e[0]),m=Q.dims[o[0]];qb.style.display='none';rs.style.display='block';rs.classList.add('fx');
$('#rn').textContent=m.name;$('#rl').textContent=m.line;$('#rt').innerHTML=Object.keys(Q.dims).sort((a,b)=>(sc2[b]||0)-(sc2[a]||0)).map(k=>`<span>${Q.dims[k].name}</span>`).join('');
$('#gh').textContent='轻触空白处 · 继续'}
$('#rt2').onclick=()=>{qi=0;sc2={};rs.style.display='none';qb.style.display='block';rq()};rq();
$('#sv').onclick=()=>{const W=900,Hh=1200,c=document.createElement('canvas');c.width=W;c.height=Hh;const g=c.getContext('2d');
let b=g.createLinearGradient(0,0,W,Hh);b.addColorStop(0,'#fdf7ee');b.addColorStop(.5,'#f2f6fb');b.addColorStop(1,'#fbf0f5');g.fillStyle=b;g.fillRect(0,0,W,Hh);
b=g.createRadialGradient(W/2,Hh*.34,0,W/2,Hh*.34,W*.7);b.addColorStop(0,'rgba(255,214,160,.55)');b.addColorStop(1,'rgba(255,214,160,0)');g.fillStyle=b;g.fillRect(0,0,W,Hh);
g.strokeStyle='rgba(185,143,74,.45)';g.lineWidth=1.5;g.strokeRect(48,48,W-96,Hh-96);g.strokeRect(62,62,W-124,Hh-124);
g.textAlign='center';g.fillStyle='#b98f4a';g.font='26px "Songti SC",serif';g.fillText(Q.badge.split('').join('  '),W/2,180);
const gr=g.createLinearGradient(W*.2,0,W*.8,0);gr.addColorStop(0,'#414659');gr.addColorStop(.5,'#b98f4a');gr.addColorStop(1,'#cf8ba6');g.fillStyle=gr;g.font='bold 76px "Songti SC",serif';g.fillText($('#rn').textContent,W/2,400);
g.fillStyle='rgba(65,70,89,.72)';g.font='26px "Songti SC",serif';let cu='',y=560;for(const ch of $('#rl').textContent){if(g.measureText(cu+ch).width>W-240&&cu){g.fillText(cu,W/2,y);y+=46;cu=ch}else cu+=ch}g.fillText(cu,W/2,y);
const t=new Date(),ds=`${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`;g.fillStyle='rgba(185,143,74,.8)';g.font='22px sans-serif';g.fillText(ds,W/2,Hh-190);
c.toBlob(bl=>{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='张力专属鉴定书_'+ds+'.png';if(ios){a.target='_blank';a.rel='noopener'}a.click();toast(ios?'已生成图片，长按可保存':'卡片已保存')})};

/* 音乐 / 提示 */
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const bgm=$('#bgm'),au=$('#au');bgm.src=C.bgm;
au.onclick=async()=>{if(bgm.paused){try{await bgm.play();au.classList.add('pl');au.textContent='❚❚'}catch(e){toast('未找到音乐文件：'+C.bgm)}}else{bgm.pause();au.classList.remove('pl');au.textContent='♪'}};

/* 启动 */
setTimeout(()=>{$('#ld').classList.add('done');document.body.classList.add('ready');S[0].classList.add('on');say()},1800);
</script>
